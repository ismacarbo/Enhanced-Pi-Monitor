name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -eu
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

      - name: Configure SSH
        shell: bash
        run: |
          set -eu
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Pull and deploy on server
        shell: bash
        run: |
          set -eu
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -eu
             cd "$HOME/Desktop/Enhanced-Pi-Monitor"
             git fetch --prune origin main
             git merge --ff-only origin/main
             make wiki-up
             sudo -n systemctl restart pimonitor.service
             make wiki-status
             docker compose \
               --project-directory infrastructure/wikijs \
               --env-file infrastructure/wikijs/.env \
               -f infrastructure/wikijs/docker-compose.yml \
               exec -T wikijs \
               curl --fail --silent --show-error http://127.0.0.1:3000/healthz > /dev/null
             curl --fail --silent --show-error http://127.0.0.1:5000/portfolio > /dev/null'
